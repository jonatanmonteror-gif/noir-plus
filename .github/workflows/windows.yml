name: Compilar Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
      - 'changelog/windows.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.9'

      - name: Compilar instalador
        working-directory: desktop
        run: gradle packageExe createDistributable --no-daemon --stacktrace
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Prueba de arranque (no se publica si no abre)
        shell: pwsh
        run: |
          $app = Get-ChildItem -Recurse desktop/build/compose/binaries -Filter *.exe | Where-Object { $_.FullName -notmatch '\\exe\\' } | Select-Object -First 1
          Get-ChildItem -Recurse desktop/build/compose/binaries -Filter *.exe | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Arrancando $($app.FullName)"
          $p = Start-Process -FilePath $app.FullName -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 40
          $alive = -not $p.HasExited
          Write-Host "Sigue abierto tras 40 s: $alive"
          Get-Content out.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          Get-Content err.txt -ErrorAction SilentlyContinue | Select-Object -Last 80
          $log = Join-Path $env:APPDATA 'NoirPlus/errors.log'
          if (Test-Path $log) { Write-Host '--- errors.log ---'; Get-Content $log | Select-Object -Last 80 }
          Get-ChildItem -Recurse -Filter 'hs_err*.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName | Select-Object -First 60 }
          if ($alive) { Stop-Process -Id $p.Id -Force } else { Write-Host "Código de salida: $($p.ExitCode)"; exit 1 }

      - name: Preparar instalador y huella SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName NoirPlus-Setup.exe
          (Get-FileHash NoirPlus-Setup.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline NoirPlus-Setup.exe.sha256
          Get-Content NoirPlus-Setup.exe.sha256

      - name: Número de versión a la vista (2.0.0 desde la compilación 58)
        shell: bash
        run: echo "DISPLAY=2.0.$(( ${{ github.run_number }} - 58 ))" >> "$GITHUB_ENV"

      - name: Publicar versión
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: windows-v2.0.${{ github.run_number }}
          name: Noir+ para Windows ${{ env.DISPLAY }}
          body: |
            Instalador de Noir+ para Windows. Necesita VLC (64 bits) instalado.
            Huella SHA-256 en NoirPlus-Setup.exe.sha256.
          files: |
            NoirPlus-Setup.exe
            NoirPlus-Setup.exe.sha256
          make_latest: false

      - name: Publicar también en la versión fija "windows" (la usa el actualizador, sin límite de consultas)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '2.0.%s' "${{ github.run_number }}" > windows-version.txt
          python tools/changelog.py windows "2.0.${{ github.run_number }}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/windows/changelog-windows.json" changelog-windows.json
          gh release view windows --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create windows --repo "$GITHUB_REPOSITORY" --title "Noir+ para Windows (última)" \
              --notes "Siempre la última versión para Windows. La usa el actualizador del programa." --prerelease --latest=false
          gh release upload windows NoirPlus-Setup.exe NoirPlus-Setup.exe.sha256 windows-version.txt changelog-windows.json --repo "$GITHUB_REPOSITORY" --clobber
