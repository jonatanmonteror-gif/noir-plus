name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
      - 'changelog/windows.txt'
      - 'tools/build_catalog.py'
      - 'tools/build_upcoming.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

# Permisos mínimos: solo publicar versiones.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Acciones fijadas a un commit concreto (no a una etiqueta que se pueda mover).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.9'

      - name: Descifrar clave de firma (si está configurada)
        env:
          NOIR_KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}
        run: |
          if [ -z "$NOIR_KEY_PASSWORD" ]; then
            echo "::warning::Sin NOIR_KEY_PASSWORD: se firma con la clave antigua."
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in app/noirplus.jks.enc -out app/noirplus.jks -pass env:NOIR_KEY_PASSWORD
          fi

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          NOIR_KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}

      - name: Borrar clave descifrada
        if: always()
        run: rm -f app/noirplus.jks

      - name: Preparar APK y huella SHA-256
        run: |
          cp app/build/outputs/apk/release/app-release.apk NoirPlus.apk
          sha256sum NoirPlus.apk | cut -d' ' -f1 > NoirPlus.apk.sha256
          echo "SHA-256: $(cat NoirPlus.apk.sha256)"

      - name: Novedades de la versión
        run: |
          python3 tools/changelog.py android "1.0.${{ github.run_number }}" \
            "https://github.com/${{ github.repository }}/releases/latest/download/changelog.json" changelog.json

      - name: Publicar versión
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Noir+ 1.0.${{ github.run_number }}
          body: |
            Huella SHA-256 del APK publicada en NoirPlus.apk.sha256.
          files: |
            NoirPlus.apk
            NoirPlus.apk.sha256
            changelog.json
          make_latest: true
