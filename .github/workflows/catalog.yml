name: Catálogo de plataformas

# Una vez al día se prepara el catálogo de plataformas en España (TMDB) en un archivo pequeño.
# La app lo descarga de una vez en lugar de hacer miles de consultas: carga mucho más rápida.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_catalog.py'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generar catálogo
        run: |
          export TMDB_KEY=$(grep -o 'BUILT_IN_KEY = "[0-9a-f]*"' app/src/main/java/com/noirplus/tv/data/Tmdb.kt | cut -d'"' -f2)
          python3 tools/build_catalog.py

      - name: Publicar (versión fija "catalog", no es la "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create catalog --repo "$GITHUB_REPOSITORY" --title "Catálogo de plataformas" \
              --notes "Se actualiza solo cada día. Lo usa la app para las plataformas y géneros." --prerelease --latest=false
          gh release upload catalog catalog-movie.json.gz catalog-tv.json.gz --repo "$GITHUB_REPOSITORY" --clobber
